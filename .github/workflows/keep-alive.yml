name: Keep All Render Services Awake

on:
  schedule:
    # Every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Manual run option

jobs:
  ping-all-services:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Backend Service
        run: |
          echo "Pinging Backend..."
          curl -I https://dataagentproject.onrender.com
          echo "Backend pinged at $(date)"
      
      - name: Ping Frontend 1 (HomePage)
        run: |
          echo "Pinging Frontend 1..."
          curl -I https://dataagentproject-1.onrender.com
          echo "Frontend 1 pinged at $(date)"
      
      - name: Ping Frontend 2 (Dashboard)
        run: |
          echo "Pinging Frontend 2..."
          curl -I https://dataagentproject-2.onrender.com
          echo "Frontend 2 pinged at $(date)"
