<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="https://www.forsysinc.com/assets/img/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="https://www.forsysinc.com/assets/img/logo.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <title>Forsys Agents</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        background-color: #f4f4f4; /* Light Grey Background */
      }

      /* Loader Container - Center lo petteddam */
      .app-loading-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        z-index: 9999;
      }

      /* Logo Style */
      .loading-logo {
        width: 80px;
        height: auto;
        margin-bottom: 20px;
        animation: pulse 2s infinite ease-in-out;
      }

      /* Spinner Animation */
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e0e0e0;
        border-top: 4px solid #d32f2f; /* Forsys Red Color or custom color */
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      /* Text Style */
      .loading-text {
        margin-top: 15px;
        color: #333;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      /* Animations */
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes pulse {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
        100% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>
  
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <div id="root">
      
      <div class="app-loading-container">
        <img src="https://www.forsysinc.com/assets/img/logo.png" alt="Forsys Logo" class="loading-logo" />
        <div class="spinner"></div>
        <div class="loading-text">Initializing Forsys Agents...</div>
      </div>

    </div>
    
  </body>
</html>
